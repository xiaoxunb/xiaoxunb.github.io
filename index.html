<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小徐的个人网站</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Microsoft YaHei",sans-serif;
  background:#f5f6f8;
  color:#222;
}
header{
  background:#fff;
  padding:22px;
  text-align:center;
  border-bottom:1px solid #eee;
}
header h1{margin:0;font-size:28px}
header p{color:#777;margin-top:10px}
main{
  max-width:800px;
  margin:40px auto;
  padding:20px;
}
.card{
  background:#fff;
  padding:25px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 3px 12px #00000008;
}
.card h2{margin-top:0}
footer{
  text-align:center;
  padding:30px;
  color:#888;
}
</style>
</head>

<body>

<header>
<h1>小徐的个人网站</h1>
<p>欢迎来到我的网站</p>
</header>

<main>
<div class="card">
<h2>关于本站</h2>
<p>这是我的个人网站，正在建设中。</p>
</div>

<div class="card">
<h2>我的内容</h2>
<p>这里以后会放置文章、作品和一些有趣的东西。</p>
</div>

<div class="card">
<h2>联系我</h2>
<p>欢迎访问我的个人网站。</p>
</div>
</main>

<footer>
© 2026 小徐的个人网站
</footer>

</body>
</html>
